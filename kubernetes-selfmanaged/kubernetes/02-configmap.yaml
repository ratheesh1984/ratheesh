apiVersion: v1
kind: ConfigMap
metadata:
  name: tomcat-sample-app
  namespace: tomcat-app
data:
  index.jsp: |
    <%@ page import="java.net.InetAddress" %>
    <html>
      <head><title>Sample Tomcat App on Kubernetes</title></head>
      <body style="font-family: sans-serif; padding: 2em;">
        <h1>Hello from Tomcat on Kubernetes!</h1>
        <p>Pod hostname: <b><%= InetAddress.getLocalHost().getHostName() %></b></p>
        <p>Pod IP: <b><%= InetAddress.getLocalHost().getHostAddress() %></b></p>
        <p>Server time: <b><%= new java.util.Date() %></b></p>
        <p>Namespace: <b>tomcat-app</b></p>
      </body>
    </html>
