---
# Gateway API - Gateway resource
# Defines the network entry point for traffic to the cluster
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tomcat-gateway
  namespace: tomcat-app
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same  # Allow routes from same namespace only
