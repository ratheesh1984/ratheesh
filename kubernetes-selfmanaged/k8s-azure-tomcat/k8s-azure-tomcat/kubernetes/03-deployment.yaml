apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcat-deployment
  namespace: tomcat-app
  labels:
    app: tomcat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tomcat
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tomcat
    spec:
      # Init container drops index.jsp into Tomcat's ROOT webapp dir
      # so the sample app is served at "/".
      initContainers:
        - name: deploy-sample-app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /usr/local/tomcat/webapps/ROOT
              cp /sample/index.jsp /usr/local/tomcat/webapps/ROOT/index.jsp
          volumeMounts:
            - name: sample-app
              mountPath: /sample
            - name: webapps
              mountPath: /usr/local/tomcat/webapps
      containers:
        - name: tomcat
          image: tomcat:9.0-jdk17
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: webapps
              mountPath: /usr/local/tomcat/webapps
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: sample-app
          configMap:
            name: tomcat-sample-app
        - name: webapps
          emptyDir: {}
