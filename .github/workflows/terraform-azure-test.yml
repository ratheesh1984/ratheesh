name: Terraform Azure Test

on:
  workflow_dispatch:       # manual trigger to test on demand
  push:
    branches: [main]
    paths:
      - 'kubernetes-selfmanaged/terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'kubernetes-selfmanaged/terraform/**'

permissions:
  id-token: write   # required for OIDC token request
  contents: read

env:
  ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  # No ARM_CLIENT_SECRET needed — OIDC handles auth
  ARM_USE_OIDC: "true"
  TF_WORKING_DIR: kubernetes-selfmanaged/terraform

jobs:
  terraform-validate:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login via OIDC (App Registration)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity
        run: az account show

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.3"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -no-color
        # Plan only — no apply, safe to run on every PR

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-validate
    # Only apply on a manual dispatch targeting main, not on PRs
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production   # requires manual approval in GitHub UI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login via OIDC (App Registration)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.3"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false
